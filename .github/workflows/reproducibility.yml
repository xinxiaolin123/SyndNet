name: Numerical reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: environments/analysis-verified.txt
      - run: python -m pip install -r environments/analysis-verified.txt
      - name: Python syntax and analysis imports
        run: |
          python -m compileall -q code inference scripts tests
          python -c "import sys; sys.path.insert(0, 'scripts'); import reproduce; import numpy, pandas, scipy, sklearn"
      - name: Integrity and checkpoint metadata
        run: python -m unittest discover -s tests
      - name: Public path checks
        run: |
          python scripts/check_public_paths.py
          python scripts/check_public_privacy.py
      - name: Synthetic numerical and format smoke
        run: |
          python scripts/validate_synthetic_formats.py
          python examples/demo_metrics.py
